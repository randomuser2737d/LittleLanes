<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Little Lanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one full-screen canvas map; thin floating HUD strips top and bottom; modal sheets for menus. */
:root{
  --bg:#c9d3d2; --land:#eef2ef; --water:#9cc5df; --water-deep:#86b6d4; --hill:#d6dac8; --hill-line:#b9bfa6;
  --road:#4b5561; --road-edge:#26303a; --grid:#dde4e0; --ink:#1d2830; --muted:#5b6973;
  --panel:rgb(250,252,251); --panel-line:rgba(29,40,48,.12); --accent:#e5622b; --accent-ink:#fff; --danger:#d63c3c;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171a; --land:#1f282c; --water:#1b425b; --water-deep:#173a50; --hill:#2a322d; --hill-line:#38423b;
  --road:#a3adb6; --road-edge:#d6dde3; --grid:#253034; --ink:#e7edf0; --muted:#98a7b0;
  --panel:rgb(22,29,33); --panel-line:rgba(231,237,240,.14); --accent:#f07a45; --accent-ink:#1a1206; --danger:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171a; --land:#1f282c; --water:#1b425b; --water-deep:#173a50; --hill:#2a322d; --hill-line:#38423b;
  --road:#a3adb6; --road-edge:#d6dde3; --grid:#253034; --ink:#e7edf0; --muted:#98a7b0;
  --panel:rgb(22,29,33); --panel-line:rgba(231,237,240,.14); --accent:#f07a45; --accent-ink:#1a1206; --danger:#ff6b6b; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strip{position:fixed;left:12px;right:12px;display:flex;align-items:center;gap:8px;pointer-events:none;flex-wrap:wrap}
.strip > *{pointer-events:auto}
#top{top:calc(env(safe-area-inset-top,0px) + 10px);justify-content:space-between}
#bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);justify-content:center}
.chip{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:7px 12px;display:flex;align-items:center;gap:10px}
.city{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em}
.small{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.score{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.week{display:flex;flex-direction:column;gap:2px;min-width:72px}
.dial{width:40px;height:40px;transform:rotate(-90deg)}
.dial-track{fill:none;stroke:var(--panel-line);stroke-width:4}
.dial-fill{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:0 100;stroke-linecap:round}
.dial-hand{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;transform-origin:22px 22px}
.dial-hub{fill:var(--ink)}
.bar{height:5px;border-radius:3px;background:var(--panel-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.tools{display:flex;gap:4px;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:5px;flex-wrap:wrap;justify-content:center}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;padding:6px 6px 4px;border:0;background:transparent;border-radius:11px}
.tool svg{width:22px;height:22px}
.tool span{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool.on span{color:var(--accent-ink)}
.tool:disabled{opacity:.35;cursor:default}
.tool.zero:not(.on){opacity:.38}
.tool .cnt{position:absolute;top:1px;right:1px;min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tool.on .cnt{background:var(--accent-ink);color:var(--accent)}
@media (max-width:480px){ .tools{align-items:center} .tool{min-width:36px!important;padding:4px 3px!important} .tool > span:not(.cnt){display:none} .tools{gap:2px} .tool:has(.cnt){min-height:44px} }
.tool.low .cnt{background:#f2b311;color:#2a1f00}
.tool.bump .cnt{animation:bump .6s ease-out}
@keyframes bump{30%{transform:scale(1.5)}}
.tool.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){ .tool.bump .cnt,.tool.shake,.tool.newtool{animation:none} }
.tool.newtool{animation:toolIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes toolIn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.tool[hidden]{display:none!important}
.tool.zero .cnt{background:var(--panel-line);color:var(--muted)}
.tool:has(.cnt){justify-content:center;min-height:46px;padding-top:10px}
.tool:has(.cnt) svg{width:24px;height:24px}
.sep{width:1px;align-self:stretch;background:var(--panel-line);margin:4px 2px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#planBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:8px 10px;max-width:calc(100% - 32px);font-size:13px}
#editor{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.ed-top,.ed-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.ed-top input,.ed-top select{font:inherit;padding:9px 12px;border-radius:12px;border:1px solid var(--panel-line);background:var(--land);color:var(--ink);min-width:0}
.ed-top input{flex:1 1 160px;max-width:260px}
#edCv{flex:1;min-height:0;width:100%;touch-action:none;cursor:crosshair}
.btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ed-sep{width:1px;height:28px;background:var(--panel-line)}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);background:var(--panel);color:var(--ink);border:1px solid var(--panel-line);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 12px 12px 14px;border-radius:16px;font-size:13px;width:min(440px, calc(100% - 32px));display:flex;gap:12px;align-items:center;animation:hintIn .35s ease-out}
#hint[hidden],#statsChip[hidden]{display:none!important}
@media (min-width:1100px){ #hint{top:auto;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:none;width:290px;box-sizing:border-box;animation:hintInL .35s ease-out} }
@keyframes hintInL{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hintIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.tut-num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:11px}
.tut-body{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;line-height:1.35}
.tut-body span{color:var(--muted)}
.tut-ok{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 12px;font-weight:600}
@media (prefers-reduced-motion: reduce){ #hint{animation:none} }
.sheet{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 55%,transparent);overflow:auto}
.sheet.over{background:linear-gradient(90deg,transparent 40%,color-mix(in srgb,var(--bg) 50%,transparent));backdrop-filter:none;align-items:center;justify-content:flex-end;padding:16px 16px 16px 16px}
.sheet.over .card{margin:0;max-width:390px;animation:overIn .45s cubic-bezier(.2,.8,.2,1)}
.sheet.over .card .btnrow .btn{flex:1 1 auto}
@keyframes overIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@media (max-width:899px){ .sheet.over{background:linear-gradient(180deg,transparent 35%,color-mix(in srgb,var(--bg) 55%,transparent));align-items:flex-end;justify-content:center} .sheet.over .card{max-width:520px;max-height:62vh;overflow:auto} @keyframes overIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}} }
.card{margin:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:22px;max-width:640px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.18)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-weight:800;font-size:clamp(34px,7vw,52px);letter-spacing:-.03em;line-height:1}
h2{font-weight:800;font-size:26px;letter-spacing:-.02em}
h3{font-weight:600;font-size:18px}
p{margin:0;line-height:1.5;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--panel-line);background:var(--land);min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt:disabled > *, .opt.dim > *{opacity:.55}
.thumb{width:100%;aspect-ratio:44/28;border-radius:10px;object-fit:cover;display:block;max-width:100%}
.opt .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel-line);color:var(--ink)}
.medals{display:flex;gap:4px}
.medal{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;border:1.5px solid var(--panel-line);color:var(--muted)}
.medal.b.got{background:#c9864f;border-color:#c9864f;color:#fff}
.medal.s.got{background:#9aa7b2;border-color:#9aa7b2;color:#fff}
.medal.g.got{background:#e0b12f;border-color:#e0b12f;color:#2a1f00}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--panel-line);background:var(--land);font-weight:500}
.weekly{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.weekly .ico svg{width:20px;height:20px;display:block}
.upgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.upg{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ico n" "name name" "plus plus" "desc desc" "have have";align-items:center;gap:6px 12px;text-align:left;padding:18px;border-radius:18px;border:2px solid var(--panel-line);background:var(--land);min-width:0;transition:transform .15s, border-color .15s}
.upg:hover,.upg:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.upg-ico{grid-area:ico;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.upg-ico svg{width:30px;height:30px}
.upg-n{grid-area:n;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.upg-name{grid-area:name;font-family:var(--display);font-weight:600;font-size:18px}
.upg-plus{grid-area:plus;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.upg-plus svg{width:18px;height:18px}
.reveal{align-items:center;text-align:center}
.reveal-ico{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.reveal-ico svg{width:56px;height:56px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){ .reveal-ico{animation:none} }
.upg-desc{grid-area:desc;color:var(--muted);font-size:13px;line-height:1.4}
.upg-have{grid-area:have;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .upg{transition:none} .upg:hover{transform:none} }
.menu-head{display:flex;align-items:center;gap:14px}
.seg{display:inline-flex;gap:0}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:12px 0 0 12px}
.seg .btn:last-child{border-radius:0 12px 12px 0}
.seg .btn + .btn{margin-left:-1px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;text-align:left;padding:0;border-radius:20px;border:2px solid var(--panel-line);background:var(--land);overflow:hidden;min-width:0;transition:transform .15s,border-color .15s}
.mode:hover,.mode:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.mode-art{display:block;width:100%;height:110px;object-fit:cover;background:var(--water)}
.mode-classic{background:linear-gradient(180deg,transparent 58%,var(--road) 58%,var(--road) 70%,transparent 70%),radial-gradient(circle at 22% 40%,#e5484d 0 9%,transparent 9.5%),radial-gradient(circle at 78% 40%,#3e7bfa 0 9%,transparent 9.5%),var(--hill)}
.mode-plus{background:linear-gradient(180deg,transparent 52%,var(--road) 52%,var(--road) 64%,transparent 64%),linear-gradient(90deg,transparent 60%,var(--water) 60%),radial-gradient(circle at 20% 34%,#eea300 0 9%,transparent 9.5%),radial-gradient(circle at 44% 30%,#8e5cd9 0 8%,transparent 8.5%),var(--hill)}
.mode-body{display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px}
.mode-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mode-title{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.mode-desc{color:var(--muted);line-height:1.45;font-size:14px}
.mode-list{display:flex;flex-direction:column;gap:3px;font-size:13px}
.mode-list span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
@media (prefers-reduced-motion: reduce){ .mode{transition:none} .mode:hover{transform:none} }
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:560px){ .tool{min-width:42px;padding:5px 3px 3px} .tool svg{width:20px;height:20px} .week{min-width:80px} .city{font-size:15px} }
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>
</head>
<body>

<canvas id="cv" aria-label="City map"></canvas>

<div id="top" class="strip" hidden>
  <div class="chip"><button id="menuBtn" class="tool" style="min-width:auto;padding:2px" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div><div id="cityName" class="city">Seattle</div><div id="cityMeta" class="small">USA · drives right</div></div></div>
  <div class="chip" id="statsChip" hidden style="position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 72px);flex-direction:column;align-items:flex-start;gap:2px;font-size:12px;min-width:190px;z-index:2"></div>
  <div class="chip"><div class="score" id="score">0</div><svg class="dial" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" class="dial-track"/><circle cx="22" cy="22" r="18" class="dial-fill" id="dialFill" pathLength="100"/><line x1="22" y1="22" x2="34" y2="22" class="dial-hand" id="dialHand"/><circle cx="22" cy="22" r="2.2" class="dial-hub"/></svg><div class="week"><div class="city" id="dayLbl" style="font-size:15px">Mon</div><div class="small" id="weekLbl">Week 1</div></div></div>
</div>

<div id="bottom" class="strip" hidden>
  <div class="tools" role="toolbar" aria-label="Building tools">
    <button class="tool on" data-tool="draw" aria-label="Draw roads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 20 L12 12 L20 12"/></svg><span class="cnt" id="nRoads">30</span></button>
    <button class="tool" data-tool="erase" aria-label="Erase roads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 20h12M5 15l8-8 6 6-6 6H9z"/></svg><span>erase</span></button>
    <button class="tool" data-tool="round" aria-label="Place roundabout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><span class="cnt" id="nRound">0</span></button>
    <button class="tool" data-tool="light" aria-label="Place traffic light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="16" rx="3"/><circle cx="12" cy="7" r="1.6" fill="currentColor"/><circle cx="12" cy="13" r="1.6"/><path d="M12 18v4"/></svg><span class="cnt" id="nLight">0</span></button>
    <button class="tool" data-tool="ferry" aria-label="Build ferry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h16l-2.5 5h-11z"/><path d="M8 14V9h7l2 5"/><path d="M2 21c2 0 2-1 4-1s2 1 4 1 2-1 4-1 2 1 4 1 2-1 4-1"/></svg><span class="cnt" id="nFerry">0</span></button>
    <button class="tool" data-tool="metro" aria-label="Build metro line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="3" width="12" height="14" rx="4"/><path d="M6 11h12"/><circle cx="9.5" cy="14" r="1" fill="currentColor"/><circle cx="14.5" cy="14" r="1" fill="currentColor"/><path d="M8 21l2-4M16 21l-2-4"/></svg><span class="cnt" id="nMetro">0</span></button>
    <button class="tool" data-tool="mway" aria-label="Build motorway"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 19 L21 5"/><path d="M5 21 L23 7" opacity=".4"/><circle cx="3" cy="19" r="2" fill="currentColor"/><circle cx="21" cy="5" r="2" fill="currentColor"/></svg><span class="cnt" id="nMway">0</span></button>
    <button class="tool" id="planBtn" aria-label="Planning mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3" /><path d="M3 22h18" stroke-dasharray="2 3"/></svg><span>plan</span></button>
    <button class="tool" id="trafBtn" aria-label="Traffic view" title="Traffic view: busy roads glow yellow to red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18c4-8 6-8 9-4s5 4 9-6"/><circle cx="7" cy="12" r="1.5" fill="currentColor"/><circle cx="17" cy="11" r="1.5" fill="currentColor"/></svg><span>traffic</span></button>

function mulberry32(a){ const f = function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; f.get = () => a|0; return f; }
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const ix = i => i % W, iy = i => (i / W) | 0;
const mkey = (a,b) => a < b ? a*N + b : b*N + a;
const isMw = (a,b) => !!(G && G.mw.size && G.mw.has(mkey(a,b)));
const isFerry = (a,b) => !!(G && G.ferry.size && G.ferry.has(mkey(a,b)));
const isMetro = (a,b) => !!(G && G.metro && G.metro.size && G.metro.has(mkey(a,b)));
const edgeLen = (a,b) => (isMw(a,b) || isFerry(a,b) || isMetro(a,b)) ? Math.hypot(ix(a)-ix(b), iy(a)-iy(b)) : (ix(a)!==ix(b) && iy(a)!==iy(b)) ? Math.SQRT2 : 1;
const isDiag = (a,b) => ix(a)!==ix(b) && iy(a)!==iy(b);
function todayKey(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function weekKey(){ const d=new Date(Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())); const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day); const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1)); return d.getUTCFullYear()*100 + Math.ceil(((d-y0)/864e5+1)/7); }
function makeCode(key, score){ const n = key*100000 + Math.min(99999, score); const chk = (n % 1295 * 37 + 11) % 1296; return n.toString(36).toUpperCase() + '-' + chk.toString(36).toUpperCase().padStart(2,'0'); }
function readCode(code){
  const m = /^([0-9A-Z]+)-([0-9A-Z]{2})$/.exec(String(code).trim().toUpperCase()); if (!m) return null;
  const n = parseInt(m[1], 36), chk = parseInt(m[2], 36);
  if (!Number.isSafeInteger(n) || (n % 1295 * 37 + 11) % 1296 !== chk) return null;
  const key = Math.floor(n / 100000), score = n % 100000, y = Math.floor(key/10000), mo = Math.floor(key/100)%100, d = key%100;
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return {key, score, date: new Date(y, mo-1, d).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'})};
}

function challengeFor(kind){

function stageRect(k){

  sheetCard.querySelectorAll('[data-endless]').forEach(b => b.onclick = () => { newGame({kind:'classic', city: CITIES.find(c=>c.id===b.dataset.endless), mods:[], seed: (Date.now() & 0x7fffffff)}); G.endless = true; G.endlessRun = true; el('cityName').textContent = G.city.name + ' · Endless'; });
  sheetCard.querySelectorAll('[data-expert]').forEach(b => b.onclick = () => newGame({kind:'expert', city: CITIES.find(c=>c.id===b.dataset.expert), mods:[], seed: (Date.now() & 0x7fffffff)}));
  const tb = sheetCard.querySelector('#tourBtn'); if (tb) tb.onclick = () => { const ids = CITIES.filter(unlocked).map(c=>c.id); newGame({kind:'tour', tourIds:ids, tourIdx:0, tourTotal:0, city: CITIES.find(c=>c.id===ids[0]), mods:[], seed:(Date.now() & 0x7fffffff)}); };
  sheetCard.querySelectorAll('[data-style]').forEach(b => b.onclick = () => { store.carStyle = b.dataset.style; save(); showMenu(paused); });
  const byId = id => (store.maps||[]).find(m => m.id === id);
  sheetCard.querySelectorAll('[data-mplay]').forEach(b => b.onclick = () => newGame({kind:'classic', city: customCity(byId(b.dataset.mplay)), mods:[], seed:(Date.now() & 0x7fffffff)}));
  sheetCard.querySelectorAll('[data-medit]').forEach(b => b.onclick = () => openEditor(byId(b.dataset.medit)));
  sheetCard.querySelectorAll('[data-mcopy]').forEach(b => b.onclick = () => { const code = shareCode(byId(b.dataset.mcopy)); navigator.clipboard?.writeText(code).then(() => toast('Map code copied'), () => toast('Could not copy the code')) ?? toast('Copy is not available here'); });
  sheetCard.querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => { if (b.dataset.sure) { store.maps = (store.maps||[]).filter(m => m.id !== b.dataset.mdel); save(); showMenu(paused); } else { b.dataset.sure = '1'; b.textContent = 'Tap again to delete'; } });
  (sheetCard.querySelector('#newMap') || {}).onclick = () => openEditor(null);
  (sheetCard.querySelector('#mapCodeForm') || {}).onsubmit = e => { e.preventDefault(); const m = readMapCode(sheetCard.querySelector('#mapCodeIn').value); if (!m) { toast("That map code doesn't look right"); return; } saveMap(m); toast(`Added ${m.name}`); showMenu(paused); };
  sheetCard.querySelectorAll('[data-sandbox]').forEach(b => b.onclick = () => newGame({kind:'sandbox', city: CITIES.find(c=>c.id===b.dataset.sandbox), mods:[], seed:(Date.now() & 0x7fffffff)}));
  sheetCard.querySelectorAll('[data-chal]').forEach(b => b.onclick = () => { const [cid, xid] = b.dataset.chal.split(':'); const x = CHALLENGES[cid].find(q => q.id === xid);
    newGame({kind:'challenge', key:x.id, goal:x.goal, chName:x.name, city: CITIES.find(c=>c.id===cid), mods: MODS.filter(m => x.mods.includes(m.id)), seed: (Date.now() & 0x7fffffff)}); });
  sheetCard.querySelectorAll('[data-theme-pick]').forEach(b => b.onclick = () => { store.theme = b.dataset.themePick; save(); applyTheme(); showMenu(paused); });
  sheetCard.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { const ch = b.dataset.ch==='daily' ? daily : weekly; newGame({kind: ch.kind, key: ch.key, city: ch.city, mods: ch.mods, seed: ch.seed}); });
}

// ---------- loop ----------
let last = performance.now()/1000;
function frame(ts){
  now = ts/1000; const rdt = Math.min(0.05, now - last); last = now;
  requestAnimationFrame(frame);
  try {
    if (G && !G.over && !G.modal && G.speed > 0) { let t = rdt*G.speed; while (t > 0 && !G.over) { const d = Math.min(0.025, t); update(d); t -= d; } }
    if (G && !G.over && !G.modal && G.speed > 0 && now - lastSave > 8) saveGame();
    render(); updateHud();
  } catch (err) { if (!frame.warned) { frame.warned = true; console.error(err); } }
}
window.__LL = { get G(){ return G; }, start: (seed, id) => newGame({kind:"classic", city: CITIES.find(c => c.id === (id || "seattle")), mods:[], seed}), step: (n, dt) => { for (let k=0;k<n;k++) update(dt || 0.025); }, frame: (t) => { if (t !== undefined) now = t; render(); updateHud(); }, cam: () => cam(), W, H, expand: () => expandStage(), paths: t => paths(t), upgradeDest: d => upgradeDest(d), chain: (v, p) => chain(v, p), stepLights: dt => stepLights(dt), lightState: t => lightState(t) };
resize(); now = performance.now()/1000;
window.claude?.hot?.snapshot?.(() => ({ save: serialize() }));
const boot = data => {
  if (data && data.save && restore(data.save)) { if (!G.pending) { G.modal = false; setSpeed(0); toast('Game updated. Press play to keep going.', 3000); } }
  else showHome();
};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
requestAnimationFrame(frame);
})();
</script>

<script>
// installed app: look for a new version on every launch and whenever the app comes back to the front
if ('serviceWorker' in navigator) addEventListener('load', () => {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => {
      if (!w || !navigator.serviceWorker.controller) return;
      const bar = document.createElement('div');
      bar.style.cssText = 'position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font:600 14px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25)';
      bar.innerHTML = 'A new version of Little Lanes is ready <button style="border:0;border-radius:10px;padding:8px 12px;font:inherit;background:var(--accent);color:#fff;cursor:pointer">Update</button>';
      bar.querySelector('button').onclick = () => { try { window.saveGame && saveGame(); } catch (e) {} w.postMessage('skipWaiting'); };
      document.body.appendChild(bar);
    };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); }); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
});

</script>
